# Race - forked from PufferLib's config/whisker_racer.ini.
#
# Changes vs upstream are documented in docs/AUDIT.md. Summary:
#   - env_name renamed whisker_racer -> race
#   - added: seed, env_idx, max_episode_steps  (determinism + episode timer)
#   - num_radial_sectors 180 -> 16: upstream hardcoded PI2/16 and then took
#     `% num_radial_sectors`, so any value >= 16 behaved as 16. 16 is what the
#     env actually ran; the sweep over 8..100 was a no-op and is removed.
#   - removed [env] num_envs and [vec] num_envs: neither is read by the vec
#     backend, which sizes from total_agents / num_buffers.
#
# Still present but unused by the env (kept for config compatibility, flagged
# in docs/AUDIT.md): reward_green, gamma, ftmp1..ftmp4, continuous.

[base]
env_name = race

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 8

[env]
# Determinism. Each env seeds two private PCG32 streams from (seed, env_idx):
# one for track geometry, one for episode start poses. env_idx is overridden
# per env by my_vec_init; the value here only applies to standalone use.
seed = 42
env_idx = 0

# Episode timer. Upstream had no time limit at all - episodes ended only on
# crash, and tick was not observable.
max_episode_steps = 2000

frameskip = 4
width = 1080
height = 720
track_width = 75
num_radial_sectors = 16
num_points = 16
bezier_resolution = 4
turn_pi_frac = 40
maxv = 5
w_ang = 0.777
max_whisker_length = 100
reward_yellow = 0.2
reward_green = -0.001
gamma = 0.9
corner_thresh = 0.5
ftmp1 = 0.5
ftmp2 = 3.0
ftmp3 = 0.3
ftmp4 = 0.0
mode7 = 0
render_many = 0
method = 2
continuous = 0

[policy]
hidden_size = 128

[train]
adam_beta1 = 0.9446160612709289
adam_beta2 = 0.9898294105500932
adam_eps = 3.599894131847621e-14
batch_size = auto
horizon = 64
clip_coef = 0.18182501031893042
ent_coef = 0.014660408908451323
gae_lambda = 0.9560790493173461
gamma = 0.9966518685154753
learning_rate = 0.009774918469042404
max_grad_norm = 1.1402446026380597
minibatch_size = 32768
prio_alpha = 0.8186786991771018
prio_beta0 = 0.49639773186725333
total_timesteps = 200_000_000
vf_clip_coef = 1.1492700894337171
vf_coef = 1.2551354745222134
vtrace_c_clip = 0
vtrace_rho_clip = 2.2637237926128577

[sweep]
method = Protein
metric = score
goal = maximize
downsample = 10

[sweep.train.total_timesteps]
distribution = log_normal
min = 19_000_000
max = 20_000_000
mean = 19_500_000
scale = auto

[sweep.env.track_width]
distribution = log_normal
min = 30
max = 75
mean = 50
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.03
mean = 0.08
max = 0.15
scale = 0.5

[sweep.env.turn_pi_frac]
distribution = uniform
min = 30
max = 75
mean = 50
scale = auto

[sweep.env.w_ang]
distribution = uniform
min = 0.523
max = 0.785
mean = 0.654
scale = auto

[sweep.env.reward_yellow]
distribution = uniform
min = 0.20
max = 0.50
mean = 0.30
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 32768
mean = 16384
scale = auto
